name: release

# Publica las imágenes en GHCR, genera su SBOM CycloneDX y las firma sin clave (cosign +
# OIDC de GitHub). El digest firmado es el que se copia a deploy/images.env (ADR 0022).
# Solo desde etiquetas `v*` (protégelas con un ruleset): firmar es dar fe del origen.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend, runner, fetcher, semgrep, trivy, egress-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Digests de las bases
        run: |
          test -f deploy/images.lock.env || { echo "::error::falta deploy/images.lock.env"; exit 1; }
          if grep -E -v '^(#|$)' deploy/images.lock.env | grep -E -v '^NAVE_[A-Z_]+=[a-z0-9./:_-]+@sha256:[0-9a-f]{64}$'; then
            echo "::error::images.lock.env con formato no válido"; exit 1
          fi
          grep -E -v '^(#|$)' deploy/images.lock.env >> "$GITHUB_ENV"
          grep -E -v '^(#|$)' deploy/scanner-versions.env >> "$GITHUB_ENV"
          grep -E -v '^(#|$)' deploy/build-versions.env >> "$GITHUB_ENV"
      - name: Contexto y argumentos
        id: spec
        env:
          NAME: ${{ matrix.image }}
        run: |
          owner=$(printf %s "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/nave-${NAME}" >> "$GITHUB_OUTPUT"
          file=""
          case "$NAME" in
            backend)  context=backend;  args="PYTHON_IMAGE=$NAVE_PYTHON_IMAGE" ;;
            frontend) context=.; file=deploy/nginx/Dockerfile; args="NODE_IMAGE=$NAVE_NODE_IMAGE"$'\n'"NGINX_IMAGE=$NAVE_NGINX_IMAGE" ;;
            runner)   context=runner;   args="PYTHON_IMAGE=$NAVE_PYTHON_IMAGE"$'\n'"DOCKER_CLI_IMAGE=$NAVE_DOCKER_CLI_IMAGE" ;;
            fetcher)  context=deploy/scanner-sandbox/fetcher; args="PYTHON_IMAGE=$NAVE_PYTHON_ALPINE_IMAGE" ;;
            semgrep)  context=deploy/scanner-sandbox/semgrep; args="PYTHON_IMAGE=$NAVE_PYTHON_IMAGE"$'\n'"SEMGREP_VERSION=$NAVE_SEMGREP_VERSION" ;;
            trivy)    context=deploy/scanner-sandbox/trivy; args="TRIVY_IMAGE=$NAVE_TRIVY_BASE_IMAGE" ;;
            egress-proxy) context=deploy/egress-proxy; args="GO_IMAGE=$NAVE_GO_IMAGE"$'\n'"SMOKESCREEN_VERSION=$NAVE_SMOKESCREEN_VERSION" ;;
            *) echo "imagen desconocida"; exit 1 ;;
          esac
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          {
            echo "args<<EOF_ARGS"
            echo "$args"
            echo "EOF_ARGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.spec.outputs.context }}
          file: ${{ steps.spec.outputs.file }}
          build-args: ${{ steps.spec.outputs.args }}
          push: true
          tags: ${{ steps.spec.outputs.ref }}:${{ github.ref_name }}
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: SBOM CycloneDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.spec.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json
          upload-artifact: false
      - name: Firmar la imagen y adjuntar el SBOM
        env:
          IMAGE: ${{ steps.spec.outputs.ref }}@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.image }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate "sbom-${NAME}.cdx.json" "$IMAGE"
      - name: Resumen (para deploy/images.env)
        env:
          LINE: ${{ steps.spec.outputs.ref }}@${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.image }}
        run: |
          upper=$(printf %s "$NAME" | tr '[:lower:]-' '[:upper:]_')
          echo "NAVE_${upper}_IMAGE=${LINE}" | tee -a "$GITHUB_STEP_SUMMARY" > "image-${NAME}.env"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image }}
          path: |
            sbom-${{ matrix.image }}.cdx.json
            image-${{ matrix.image }}.env
          if-no-files-found: error

  # La página de la release lleva los SBOM y los digests publicados, cada fichero con su firma
  # sin clave (bundle de Sigstore). Las imágenes ya van firmadas en GHCR por el job anterior.
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Digests y firmas
        working-directory: dist
        run: |
          cat image-*.env | sort > nave-images.env
          rm image-*.env
          for f in nave-images.env sbom-*.cdx.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Crear la release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Imágenes firmadas con cosign (sin clave, OIDC de GitHub Actions) y con SBOM CycloneDX adjunto como atestación."
            echo
            echo "Copia \`nave-images.env\` en \`deploy/images.env\` para desplegar exactamente estos digests."
            echo
            echo "Verificar una imagen (cosign 3 o posterior):"
            echo
            echo '```'
            echo "cosign verify --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com <imagen>@sha256:..."
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "NAVE $TAG" \
            --notes-file notes.md --generate-notes \
            nave-images.env nave-images.env.sigstore.json sbom-*.cdx.json sbom-*.cdx.json.sigstore.json
