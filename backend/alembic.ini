# La URL NO va aquí: se toma de NAVE_DATABASE_URL (construida desde un Docker secret)
# para que la contraseña nunca acabe en el repositorio ni en este fichero.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
# Separador del sistema operativo: rutas con espacios (habituales en Windows) no se parten.
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
