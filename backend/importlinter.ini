[importlinter]
root_package = nave
include_external_packages = True

[importlinter:contract:layers]
name = Regla de dependencia entre capas (CLAUDE.md §5.1)
type = layers
layers =
    nave.bootstrap
    nave.delivery
    nave.infrastructure
    nave.application
    nave.domain

[importlinter:contract:domain-is-pure]
name = domain no importa frameworks ni E/S
type = forbidden
source_modules =
    nave.domain
forbidden_modules =
    nave.application
    nave.infrastructure
    nave.delivery
    nave.bootstrap
    flask
    celery
    sqlalchemy
    pydantic
    redis
    requests
    httpx
    subprocess
    socket
    os
    pickle

[importlinter:contract:application-is-pure]
name = application solo depende de domain
type = forbidden
source_modules =
    nave.application
forbidden_modules =
    nave.infrastructure
    nave.delivery
    nave.bootstrap
    flask
    celery
    sqlalchemy
    pydantic
    redis
    requests
    httpx
    subprocess
    socket
    pickle
