# Nginx sin privilegios (ADR 0022). Escucha en 8080 (redirección) y 8443 (TLS); Compose los
# publica como 80 y 443. Sin variables de entorno: lo que cambia por entorno son ficheros
# montados (certificado y HSTS), no plantillas.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # `$uri` y no `$request_uri`: el callback OIDC lleva `code` y `state` en la consulta y
    # no deben acabar en los registros (AM-921).
    log_format nave '$remote_addr "$request_method $uri" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /dev/stdout nave;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    client_max_body_size 1m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    gzip off;

    # Límites globales por IP (ADR 0018: el límite global vive en el proxy).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Solo nombres de host con forma de nombre de host.
    map $host $host_valid {
        default 0;
        "~^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$" 1;
    }

    server {
        listen 8080 default_server;
        server_name _;

        location = /nginx-healthz {
            access_log off;
            default_type text/plain;
            include /etc/nginx/snippets/security-headers.conf;
            return 200 "ok\n";
        }

        location / {
            if ($host_valid = 0) {
                return 421;
            }
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl default_server;
        server_name _;

        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:ssl:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        limit_conn perip 40;

        location = /nginx-healthz {
            access_log off;
            default_type text/plain;
            include /etc/nginx/snippets/security-headers.conf;
            return 200 "ok\n";
        }

        # Webhook de GitHub: cuerpo hasta 5 MiB (igual que la API) y límite propio.
        location /api/v1/webhooks/ {
            limit_req zone=webhook burst=20 nodelay;
            client_max_body_size 5m;
            include /etc/nginx/snippets/proxy-api.conf;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/snippets/proxy-api.conf;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Recursos con hash en el nombre: caché larga e inmutable.
        location /assets/ {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # SPA: toda ruta desconocida vuelve a index.html, que nunca se cachea.
        location / {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }
}
