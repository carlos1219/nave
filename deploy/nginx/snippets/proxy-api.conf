# Misma origen: no hay CORS. `X-Forwarded-For` se SOBRESCRIBE con la IP del socket: un
# cliente no puede falsear su IP (la API confía en un solo salto, ADR 0018).
# Con variable, Nginx resuelve `api` en cada petición (resolver de Docker): un reinicio de la
# API cambia su IP y, sin esto, quedaría apuntando a la antigua hasta recargar Nginx.
set $api_upstream http://api:8000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_intercept_errors off;
