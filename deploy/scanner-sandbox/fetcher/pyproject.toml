# Solo configuración de herramientas: el fetcher se despliega como imagen, no como paquete.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S", "BLE", "T20", "SIM",
    "RET", "PT", "PIE", "PL", "RUF", "ERA", "TRY", "DTZ", "PERF", "FBT",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "PLR2004", "FBT", "PLR0915", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pathguard.py", "nave_fetch.py"]
