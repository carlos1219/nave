[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nave-runner"
version = "0.1.0"
description = "NAVE scan-runner: único componente con acceso al motor de contenedores (ADR 0002, ADR 0012)"
requires-python = ">=3.12,<3.13"
# Sin dependencias en ejecución, a propósito: es el componente con más privilegios
# (AM-403) y su superficie de cadena de suministro debe ser la biblioteca estándar.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S", "BLE", "T20", "SIM",
    "RET", "PT", "PIE", "PL", "RUF", "ERA", "TRY", "DTZ", "PERF", "FBT",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "FBT", "PLR0915", "S603", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
mypy_path = "src"
packages = ["nave_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["nave_runner"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
